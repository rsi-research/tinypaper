[project]
name = "tinypaper"
version = "0.3.0"
description = "A markdown format for research results that can be checked by running them"
requires-python = ">=3.10"
dependencies = ["pyyaml", "numpy", "pydantic>=2"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tinypaper"]
