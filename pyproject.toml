[project]
name = "tinypaper"
version = "0.5.0"
description = "The paper format for research agents: every claim can be verified"
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyyaml", "numpy", "pydantic>=2"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tinypaper"]
