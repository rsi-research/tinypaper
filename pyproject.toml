[project]
name = "tinypaper"
version = "0.5.0"
description = "Executable papers for research agents: one Markdown file, runnable experiments, checkable claims"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["research agents", "reproducibility", "ai for science", "markdown"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyyaml", "numpy", "pydantic>=2"]

[project.urls]
Homepage = "https://github.com/rsi-research/tinypaper"
Repository = "https://github.com/rsi-research/tinypaper"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tinypaper"]
