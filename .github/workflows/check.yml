name: check papers

# Runs on every push and pull request. It executes the code in the papers, so it is given no
# secrets and read-only access. Do not add secrets to this job, and do not switch it to
# pull_request_target.
on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu    # CPU builds of torch: the runner has no GPU
      BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the tools
        run: pip install --quiet -e .
      - name: Test the tools
        run: python tests/test_tinypaper.py
      - name: Check and rerun the papers this change touches
        run: python -m tinypaper.ci example-vault --time 2m
